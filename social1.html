<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園社交大歷險 </title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #2b6cb0;
            margin: 0 0 8px 0;
            font-size: 22px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #4a5568;
            font-weight: bold;
        }
        .story-box {
            background-color: #ebf8ff;
            border-left: 5px solid #3182ce;
            padding: 16px;
            border-radius: 4px;
            font-size: 16px;
            line-height: 1.6;
            color: #2d3748;
            margin-bottom: 20px;
            min-height: 110px;
            white-space: pre-line;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-option {
            background-color: #ffffff;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            padding: 14px;
            text-align: left;
            font-size: 15px;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }
        .btn-option:hover:not(:disabled) {
            border-color: #3182ce;
            background-color: #f7fafc;
            transform: translateY(-2px);
        }
        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .feedback-box {
            background-color: #feebc8;
            border-left: 5px solid #dd6b20;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 14px;
            color: #742a2a;
            display: none;
            line-height: 1.5;
        }
        .btn-restart {
            margin-top: 20px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .btn-restart:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <h1>🏫 校園社交大歷險（8關卡篇）</h1>
        <div class="status-bar">
            <span id="step-count">關卡：1 / 8</span>
            <span id="score-count">社交好感度：50</span>
        </div>
    </div>

    <div class="story-box" id="story">故事加載中...</div>

    <div class="options-container" id="options"></div>

    <div class="feedback-box" id="feedback"></div>

    <button class="btn-restart" id="restart-btn" onclick="startGame()">重新開始挑戰</button>
</div>

function startGame() {
    score = 50;
    currentLevelIndex = 1;
    currentSceneId = "L1_START";
    document.getElementById("restart-btn").style.display = "none";
    showScene();
}

function showScene() {
    document.getElementById("feedback").style.display = "none";
    
    if (currentSceneId === "END") {
        showEnding();
        return;
    }

    const currentData = storyTree[currentSceneId];
    
    document.getElementById("step-count").innerText = `關卡：${currentData.level} / 8`;
    document.getElementById("score-count").innerText = `社交好感度：${score}`;
    document.getElementById("story").innerText = currentData.scene;

    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    currentData.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerText = opt.text;
        btn.onclick = () => makeChoice(opt);
        optionsContainer.appendChild(btn);
    });
}

function makeChoice(option) {
    score += option.scoreChange;
    document.getElementById("score-count").innerText = `社交好感度：${score}`;

    const feedbackBox = document.getElementById("feedback");
    feedbackBox.innerText = option.feedback;
    feedbackBox.style.display = "block";

    // 禁用所有按鈕防止重複點擊
    const buttons = document.querySelectorAll(".btn-option");
    buttons.forEach(btn => btn.disabled = true);

    setTimeout(() => {
        currentSceneId = option.nextScene;
        showScene();
    }, 3200); // 3.2秒後跳轉到對應的分支關卡
}

function showEnding() {
    document.getElementById("step-count").innerText = "挑戰完成";
    const storyBox = document.getElementById("story");
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    let endingTitle = "";
    let endingDesc = "";

    if (score >= 100) {
        endingTitle = "🏆 結局 A：完美社交大師（解鎖黃金夥伴）";
        endingDesc = "你完美運用了「社交過濾器」、「換位思考」與「我訊息」！阿樂對你無比信任，其他同學也極力爭取下次要跟你同一組。你成功建立起了穩固的同儕支持圈！";
    } else if (score >= 65) {
        endingTitle = "😐 結局 B：漸入佳境的合作者";
        endingDesc = "雖然過程中有一點摩擦與直白的言語，但你成功靠著修補技巧完成任務。只要多加練習「大腦過濾網」，你的社交魅力會更上一層樓！";
    } else {
        endingTitle = "💔 结局 C：獨行俠的迷思";
        endingDesc = "直白的批評、忽視眼神與衝動的情緒讓這次合作充滿火藥味。阿樂最後默默離開了。請記住：試著站在對方角度想想看，社交會變得完全不一樣！";
    }

    storyBox.innerHTML = `<strong>${endingTitle}</strong><br><br>${endingDesc}<br><br><strong>最終社交好感度：${score} 分</strong>`;
    document.getElementById("restart-btn").style.display = "block";
}

// 啟動遊戲
startGame();
</script>
