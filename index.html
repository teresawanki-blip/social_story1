<!DOCTYPE html>

        .intro-section {

        .intro-title {

        }
        .intro-subtitle {
            font-size: 18px;
            color: #2c5282;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        }
        .intro-list li {
            margin-bottom: 8px;
        }
        .btn-start-game {

            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;

        }

            background-color: #2b6cb0;

            font-weight: bold;
        }

            border-radius: 8px;

            margin-bottom: 20px;

        }

            flex-direction: column;
            gap: 12px;
        }

            background-color: #ffffff;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            padding: 14px;
            text-align: left;
            font-size: 15px;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;

            border-color: #3182ce;
            background-color: #f7fafc;
            transform: translateY(-2px);
        }
        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

            background-color: #feebc8;
            border-left: 5px solid #dd6b20;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            color: #742a2a;

            line-height: 1.5;

            color: white;
            border: none;
            border-radius: 8px;

        <div class="intro-subtitle">🌟 課程目標</div>

        <div class="intro-subtitle">🎮 如何遊玩</div>

</div>

// 點擊「點我開始遊玩」時切換頁面
function launchGame() {
    document.getElementById("intro-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    startGame();
}

function startGame() {
    score = 50;
    currentSceneId = "L1_START";
    document.getElementById("restart-btn").style.display = "none";
    showScene();
}

function showScene() {
    document.getElementById("feedback").style.display = "none";
    
    if (currentSceneId === "END") {
        showEnding();
        return;
    }

    const currentData = storyTree[currentSceneId];
    
    document.getElementById("step-count").innerText = `關卡：${currentData.level} / 8`;
    document.getElementById("score-count").innerText = `社交好感度：${score}`;
    document.getElementById("story").innerText = currentData.scene;

    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    currentData.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerText = opt.text;
        btn.onclick = () => makeChoice(opt);
        optionsContainer.appendChild(btn);
    });
}

function makeChoice(option) {
    score += option.scoreChange;
    document.getElementById("score-count").innerText = `社交好感度：${score}`;

    const feedbackBox = document.getElementById("feedback");
    feedbackBox.innerText = option.feedback;
    feedbackBox.style.display = "block";

    const buttons = document.querySelectorAll(".btn-option");
    buttons.forEach(btn => btn.disabled = true);

    setTimeout(() => {
        currentSceneId = option.nextScene;
        showScene();
    }, 3200);
}

function showEnding() {
    document.getElementById("step-count").innerText = "挑戰完成";
    const storyBox = document.getElementById("story");
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    let endingTitle = "";
    let endingDesc = "";

    if (score >= 100) {
        endingTitle = "🏆 結局 A：完美社交大師（解鎖黃金夥伴）";
        endingDesc = "你完美運用了「大腦社交過濾器」、「換位思考」與適當的社交禮儀！阿樂對你無比信任，你成功建立起了良好的同儕互動！";
    } else if (score >= 65) {
        endingTitle = "😐 結局 B：漸入佳境的合作者";
        endingDesc = "雖然過程中有一點直白的言語，但你成功靠著修補技巧與冷靜態度完成任務。多練習「大腦過濾網」，你的社交魅力會更上一層樓！";
    } else {
        endingTitle = "💔 結局 C：獨行俠的迷思";
        endingDesc = "直白的批評與忽視對方的感受讓這次合作充滿尷尬。請記住：多使用大腦過濾器並站在對方角度想想看，社交會變得更順暢！";
    }

    storyBox.innerHTML = `<strong>${endingTitle}</strong><br><br>${endingDesc}<br><br><strong>最終社交好感度：${score} 分</strong>`;
    document.getElementById("restart-btn").style.display = "block";
}
</script>
